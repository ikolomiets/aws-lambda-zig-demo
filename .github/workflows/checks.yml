name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Offline and runtime checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Provision host tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq curl xz-utils

      - name: Check changed content for private AWS details
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUSH_REF: ${{ github.ref }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            default_ref="refs/remotes/origin/$DEFAULT_BRANCH"
            if [ "$PUSH_REF" != "refs/heads/$DEFAULT_BRANCH" ] && \
              git show-ref --verify --quiet "$default_ref"; then
              base="$(git merge-base "$default_ref" HEAD)"
            else
              base="$(git hash-object -t tree --stdin < /dev/null)"
            fi
          fi
          bash scripts/check_aws_privacy.sh --base "$base" --head HEAD

      - name: Provision Zig 0.17.1
        env:
          # https://ziglang.org/download/index.json, 0.17.1 / aarch64-linux
          ZIG_SHA256: a1546d5646eb184437918d6635ca6b762a0e889eac09cef720ee7a1ed3fe7795
        run: |
          curl --fail --location --retry 3 \
            https://ziglang.org/download/0.17.1/zig-aarch64-linux-0.17.1.tar.xz \
            --output "$RUNNER_TEMP/zig.tar.xz"
          printf '%s  %s\n' "$ZIG_SHA256" "$RUNNER_TEMP/zig.tar.xz" | sha256sum --check -
          mkdir "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Provision pinned packages
        run: |
          test "$(zig version)" = 0.17.1
          zig build --fetch

      - name: Run offline and loopback runtime checks
        run: ./check.sh
