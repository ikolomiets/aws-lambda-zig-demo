AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Deploy the aws-lambda-zig demo function with a public Lambda Function URL.

Parameters:
  FunctionName:
    Type: String
    Default: aws-lambda-zig-demo
    Description: Name of the Lambda function to create.
  LambdaPrincipal:
    Type: String
    Default: "*"
    Description: Value exposed to the function as LAMBDA_PRINCIPAL.
  PasetoPublicKey:
    Type: String
    Description: Padded Base64 Ed25519 public key used to verify PASETO tokens.

Resources:
  OperationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  OperationsQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  DemoFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref FunctionName
      Description: Demo function built with aws-lambda-zig.
      CodeUri: lambda.zip
      Runtime: provided.al2023
      Handler: bootstrap
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 3
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt OperationsTable.Arn
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt OperationsQueue.Arn
      Environment:
        Variables:
          LAMBDA_PRINCIPAL: !Ref LambdaPrincipal
          OPERATIONS_QUEUE_URL: !Ref OperationsQueue
          OPERATIONS_TABLE_NAME: !Ref OperationsTable
          PASETO_PUBLIC_KEY: !Ref PasetoPublicKey

  DemoFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt DemoFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED
      Cors:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
        AllowHeaders:
          - "*"

  FunctionUrlInvokeFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    DependsOn: DemoFunctionUrl
    Properties:
      FunctionName: !Ref DemoFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  FunctionUrlInvokeFunctionPermission:
    Type: AWS::Lambda::Permission
    DependsOn: DemoFunctionUrl
    Properties:
      FunctionName: !Ref DemoFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  OperationsTableName:
    Description: CloudFormation-generated DynamoDB operations table name.
    Value: !Ref OperationsTable
  OperationsQueueUrl:
    Description: CloudFormation-generated SQS operations queue URL.
    Value: !Ref OperationsQueue
  FunctionName:
    Description: Deployed Lambda function name.
    Value: !Ref DemoFunction
  FunctionArn:
    Description: Deployed Lambda function ARN.
    Value: !GetAtt DemoFunction.Arn
  FunctionUrl:
    Description: Public Lambda Function URL.
    Value: !GetAtt DemoFunctionUrl.FunctionUrl
