AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Deploy the aws-lambda-zig Hello World function with a public Lambda Function URL.

Parameters:
  FunctionName:
    Type: String
    Default: aws-lambda-zig-hello
    Description: Name of the Lambda function to create.

Resources:
  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref FunctionName
      Description: Hello World demo built with aws-lambda-zig.
      CodeUri: lambda.zip
      Runtime: provided.al2023
      Handler: bootstrap
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 3
      Policies:
        - AWSLambdaBasicExecutionRole

  HelloFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt HelloFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED
      Cors:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
        AllowHeaders:
          - "*"

  FunctionUrlInvokeFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    DependsOn: HelloFunctionUrl
    Properties:
      FunctionName: !Ref HelloFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  FunctionUrlInvokeFunctionPermission:
    Type: AWS::Lambda::Permission
    DependsOn: HelloFunctionUrl
    Properties:
      FunctionName: !Ref HelloFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  FunctionName:
    Description: Deployed Lambda function name.
    Value: !Ref HelloFunction
  FunctionArn:
    Description: Deployed Lambda function ARN.
    Value: !GetAtt HelloFunction.Arn
  FunctionUrl:
    Description: Public Lambda Function URL.
    Value: !GetAtt HelloFunctionUrl.FunctionUrl
