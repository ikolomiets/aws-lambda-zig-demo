AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Deploy intake and query Lambdas plus TigerBeetle and Completion processors with an optional WireGuard gateway.

# Opt-in network parameters intentionally default to empty and are guarded by a Rule.
Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - W1030

Parameters:
  IntakeFunctionName:
    Type: String
    Default: intake-lambda
    Description: Name of the operation intake Lambda function.
  QueryFunctionName:
    Type: String
    Default: query-lambda
    Description: Name of the operation query Lambda function.
  TigerBeetleProcessorName:
    Type: String
    Default: tiger-beetle-processor
    Description: Name of the TigerBeetle processor Lambda function.
  CompletionProcessorName:
    Type: String
    Default: completion-processor
    Description: Name of the Completion processor Lambda function.
  TigerBeetleClusterId:
    Type: String
    Default: "0"
    AllowedPattern: '^[0-9]{1,39}$'
    ConstraintDescription: Must be an unsigned decimal 128-bit cluster ID.
    Description: TigerBeetle cluster ID used by the TigerBeetle processor.
  TigerBeetleAddresses:
    Type: String
    Default: 10.200.0.2:3000
    MinLength: 1
    MaxLength: 4096
    AllowedPattern: '^\S+$'
    ConstraintDescription: Must be a non-empty address list without whitespace.
    Description: Comma-separated TigerBeetle replica addresses used by the TigerBeetle processor.
  LambdaPrincipal:
    Type: String
    Default: "*"
    Description: Value exposed to the function as LAMBDA_PRINCIPAL.
  PasetoPublicKey:
    Type: String
    Description: Padded Base64 Ed25519 public key used to verify PASETO tokens.
  EnableWireGuardGateway:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Whether to provision the optional EC2 WireGuard gateway.
  RetainTigerBeetleProcessorVpcCleanupResources:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Internal deploy-helper switch retaining the stack-owned EIGW, IPv6 route, TigerBeetle processor security group, and Lambda ENI cleanup resources during VPC detachment.
  VpcId:
    Type: String
    Default: ""
    AllowedPattern: '^$|^vpc-([0-9a-f]{8}|[0-9a-f]{17})$'
    ConstraintDescription: Must be an EC2 VPC ID.
    Description: ID of the existing VPC; its IPv6 CIDR association remains externally managed.
  GatewayPublicSubnetId:
    Type: String
    Default: ""
    AllowedPattern: '^$|^subnet-([0-9a-f]{8}|[0-9a-f]{17})$'
    ConstraintDescription: Must be an EC2 subnet ID.
    Description: ID of the existing public subnet for the WireGuard gateway.
  LambdaSubnetId:
    Type: String
    Default: ""
    AllowedPattern: '^$|^subnet-([0-9a-f]{8}|[0-9a-f]{17})$'
    ConstraintDescription: Must be an EC2 subnet ID.
    Description: ID of the existing private TigerBeetle processor subnet; its IPv6 CIDR association remains externally managed.
  LambdaRouteTableId:
    Type: String
    Default: ""
    AllowedPattern: '^$|^rtb-([0-9a-f]{8}|[0-9a-f]{17})$'
    ConstraintDescription: Must be an EC2 route-table ID.
    Description: ID of the external route table where SAM manages TigerBeetle processor routes.
  LambdaSubnetCidr:
    Type: String
    Default: ""
    AllowedPattern: '^$|^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)/([0-9]|[12][0-9]|3[0-2])$'
    ConstraintDescription: Must be an IPv4 CIDR block.
    Description: IPv4 CIDR block of the Lambda subnet.
  WireGuardPrivateKeyParameterName:
    Type: String
    Default: ""
    AllowedPattern: '^$|^/(?![Aa][Ww][Ss]|[Ss][Ss][Mm])[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$'
    ConstraintDescription: Must be an absolute Parameter Store path that does not begin with aws or ssm.
    Description: Absolute path of the SecureString containing the gateway private key.
  WireGuardPrivateKeyParameterVersion:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Version of the WireGuard private-key Parameter Store parameter.
  WireGuardGatewayPublicKey:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[A-Za-z0-9+/]{43}=$'
    ConstraintDescription: Must be a padded 44-character WireGuard Base64 public key.
    Description: Public key derived from the gateway private key.
  WireGuardWorkstationPublicKey:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[A-Za-z0-9+/]{43}=$'
    ConstraintDescription: Must be a padded 44-character WireGuard Base64 public key.
    Description: Public key of the development workstation WireGuard peer.
  WireGuardAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Parameter Store path resolving to the ARM64 gateway AMI.
  WireGuardInstanceType:
    Type: String
    Default: t4g.nano
    Description: ARM64 EC2 instance type for the WireGuard gateway.

Rules:
  WireGuardGatewayInputsRequired:
    RuleCondition: !Equals [!Ref EnableWireGuardGateway, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref VpcId, ""]]
        AssertDescription: VpcId is required when the WireGuard gateway is enabled.
      - Assert: !Not [!Equals [!Ref GatewayPublicSubnetId, ""]]
        AssertDescription: GatewayPublicSubnetId is required when the gateway is enabled.
      - Assert: !Not [!Equals [!Ref LambdaSubnetId, ""]]
        AssertDescription: LambdaSubnetId is required when the WireGuard gateway is enabled.
      - Assert: !Not [!Equals [!Ref LambdaRouteTableId, ""]]
        AssertDescription: LambdaRouteTableId is required when the gateway is enabled.
      - Assert: !Not [!Equals [!Ref LambdaSubnetCidr, ""]]
        AssertDescription: LambdaSubnetCidr is required when the WireGuard gateway is enabled.
      - Assert: !Not [!Equals [!Ref WireGuardPrivateKeyParameterName, ""]]
        AssertDescription: The private-key parameter name is required when the gateway is enabled.
      - Assert: !Not [!Equals [!Ref WireGuardGatewayPublicKey, ""]]
        AssertDescription: The gateway public key is required when the gateway is enabled.
      - Assert: !Not [!Equals [!Ref WireGuardWorkstationPublicKey, ""]]
        AssertDescription: The workstation public key is required when the gateway is enabled.
      - Assert: !Not [!Equals [!Ref WireGuardAmiId, ""]]
        AssertDescription: WireGuardAmiId is required when the WireGuard gateway is enabled.
      - Assert: !Not [!Equals [!Ref WireGuardInstanceType, ""]]
        AssertDescription: WireGuardInstanceType is required when the gateway is enabled.
  TigerBeetleProcessorVpcCleanupInputsRequired:
    RuleCondition: !Equals [!Ref RetainTigerBeetleProcessorVpcCleanupResources, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref VpcId, ""]]
        AssertDescription: VpcId is required while TigerBeetle processor VPC cleanup resources are retained.
      - Assert: !Not [!Equals [!Ref LambdaRouteTableId, ""]]
        AssertDescription: LambdaRouteTableId is required while TigerBeetle processor VPC cleanup resources are retained.

Conditions:
  WireGuardGatewayEnabled: !Equals [!Ref EnableWireGuardGateway, "true"]
  TigerBeetleProcessorVpcCleanupResourcesRetained: !Or
    - !Condition WireGuardGatewayEnabled
    - !Equals [!Ref RetainTigerBeetleProcessorVpcCleanupResources, "true"]

Resources:
  OperationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  TigerBeetleQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: TigerBeetleQueue
      VisibilityTimeout: 90

  CompletionQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      VisibilityTimeout: 90

  IntakeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref IntakeFunctionName
      Description: Authenticated operation intake function built with aws-lambda-zig.
      CodeUri: intake-lambda.zip
      Runtime: provided.al2023
      Handler: bootstrap
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 3
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt OperationsTable.Arn
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt TigerBeetleQueue.Arn
      Environment:
        Variables:
          LAMBDA_PRINCIPAL: !Ref LambdaPrincipal
          TigerBeetleQueue: !Ref TigerBeetleQueue
          OPERATIONS_TABLE_NAME: !Ref OperationsTable
          PASETO_PUBLIC_KEY: !Ref PasetoPublicKey

  IntakeFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt IntakeFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED

  FunctionUrlInvokeFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    DependsOn: IntakeFunctionUrl
    Properties:
      FunctionName: !Ref IntakeFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  FunctionUrlInvokeFunctionPermission:
    Type: AWS::Lambda::Permission
    DependsOn: IntakeFunctionUrl
    Properties:
      FunctionName: !Ref IntakeFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  QueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref QueryFunctionName
      Description: Authenticated tenant-scoped operation query built with aws-lambda-zig.
      CodeUri: query-lambda.zip
      Runtime: provided.al2023
      Handler: bootstrap
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 3
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt OperationsTable.Arn
      Environment:
        Variables:
          LAMBDA_PRINCIPAL: !Ref LambdaPrincipal
          OPERATIONS_TABLE_NAME: !Ref OperationsTable
          PASETO_PUBLIC_KEY: !Ref PasetoPublicKey

  QueryFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt QueryFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED

  QueryFunctionUrlInvokeFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    DependsOn: QueryFunctionUrl
    Properties:
      FunctionName: !Ref QueryFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  QueryFunctionUrlInvokeFunctionPermission:
    Type: AWS::Lambda::Permission
    DependsOn: QueryFunctionUrl
    Properties:
      FunctionName: !Ref QueryFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # Keep this role explicit so the deploy helper can retain ENI cleanup permissions
  # only between the VPC-detach and cleanup phases.
  TigerBeetleProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - !Sub lambda.${AWS::URLSuffix}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: TigerBeetleProcessorTigerBeetleQueuePoller
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ChangeMessageVisibility
                  - sqs:ChangeMessageVisibilityBatch
                  - sqs:DeleteMessage
                  - sqs:DeleteMessageBatch
                  - sqs:GetQueueAttributes
                  - sqs:ReceiveMessage
                Resource: !GetAtt TigerBeetleQueue.Arn
        - PolicyName: TigerBeetleProcessorCompletionPublisher
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt CompletionQueue.Arn
        - !If
          - TigerBeetleProcessorVpcCleanupResourcesRetained
          - PolicyName: TigerBeetleProcessorVpcAccess
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - ec2:CreateNetworkInterface
                    - ec2:DescribeNetworkInterfaces
                    - ec2:DescribeSubnets
                    - ec2:DeleteNetworkInterface
                    - ec2:AssignPrivateIpAddresses
                    - ec2:UnassignPrivateIpAddresses
                  Resource: "*"
          - !Ref AWS::NoValue

  TigerBeetleProcessor:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref TigerBeetleProcessorName
      Description: SQS-driven TigerBeetle processor built with aws-lambda-zig.
      CodeUri: tiger-beetle-processor.zip
      Runtime: provided.al2023
      Handler: bootstrap
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 15
      Role: !GetAtt TigerBeetleProcessorRole.Arn
      Environment:
        Variables:
          AWS_USE_DUALSTACK_ENDPOINT: !If
            - WireGuardGatewayEnabled
            - "true"
            - "false"
          COMPLETION_QUEUE_URL: !Ref CompletionQueue
          TIGERBEETLE_ADDRESSES: !Ref TigerBeetleAddresses
          TIGERBEETLE_CLUSTER_ID: !Ref TigerBeetleClusterId
      VpcConfig: !If
        - WireGuardGatewayEnabled
        - Ipv6AllowedForDualStack: true
          SecurityGroupIds:
            - !Ref TigerBeetleProcessorSecurityGroup
          SubnetIds:
            - !Ref LambdaSubnetId
        - !Ref AWS::NoValue

  TigerBeetleProcessorQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref TigerBeetleProcessor
      EventSourceArn: !GetAtt TigerBeetleQueue.Arn
      Enabled: true
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 0
      ScalingConfig:
        MaximumConcurrency: 8
      FunctionResponseTypes:
        - ReportBatchItemFailures

  CompletionProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - !Sub lambda.${AWS::URLSuffix}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CompletionProcessorSqsPoller
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ChangeMessageVisibility
                  - sqs:ChangeMessageVisibilityBatch
                  - sqs:DeleteMessage
                  - sqs:DeleteMessageBatch
                  - sqs:GetQueueAttributes
                  - sqs:ReceiveMessage
                Resource: !GetAtt CompletionQueue.Arn
        - PolicyName: CompletionProcessorOperationUpdate
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                Resource: !GetAtt OperationsTable.Arn

  CompletionProcessor:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref CompletionProcessorName
      Description: SQS-driven Completion processor built with aws-lambda-zig.
      CodeUri: completion-processor.zip
      Runtime: provided.al2023
      Handler: bootstrap
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 15
      Role: !GetAtt CompletionProcessorRole.Arn
      Environment:
        Variables:
          OPERATIONS_TABLE_NAME: !Ref OperationsTable

  CompletionProcessorQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref CompletionProcessor
      EventSourceArn: !GetAtt CompletionQueue.Arn
      Enabled: true
      BatchSize: 1
      MaximumBatchingWindowInSeconds: 0
      FunctionResponseTypes:
        - ReportBatchItemFailures

  TigerBeetleProcessorSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: TigerBeetleProcessorVpcCleanupResourcesRetained
    # The gateway and cleanup Rules exclude an empty VPC before this resource exists.
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - W1030
    Properties:
      GroupDescription: Stack-owned TigerBeetle processor egress to TigerBeetle and AWS APIs.
      VpcId: !Ref VpcId
      SecurityGroupIngress: []
      SecurityGroupEgress:
        - Description: TigerBeetle traffic through the WireGuard gateway.
          IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: 10.200.0.2/32
        - Description: HTTPS to AWS dual-stack service endpoints through the EIGW.
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIpv6: "::/0"

  # SAM owns the EIGW and TigerBeetle processor route. The supplied VPC and subnet IPv6
  # CIDR associations are prerequisites and remain externally managed.
  TigerBeetleProcessorEgressOnlyInternetGateway:
    Type: AWS::EC2::EgressOnlyInternetGateway
    Condition: TigerBeetleProcessorVpcCleanupResourcesRetained
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      VpcId: !Ref VpcId

  TigerBeetleProcessorSqsIpv6Route:
    Type: AWS::EC2::Route
    Condition: TigerBeetleProcessorVpcCleanupResourcesRetained
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RouteTableId: !Ref LambdaRouteTableId
      DestinationIpv6CidrBlock: "::/0"
      EgressOnlyInternetGatewayId: !Ref TigerBeetleProcessorEgressOnlyInternetGateway

  WireGuardGatewaySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: WireGuardGatewayEnabled
    # The gateway Rule excludes empty opt-in defaults before this resource exists.
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - W1030
    Properties:
      GroupDescription: WireGuard gateway ingress and egress.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: Public WireGuard tunnel endpoint.
          IpProtocol: udp
          FromPort: 51820
          ToPort: 51820
          CidrIp: 0.0.0.0/0
        - Description: TigerBeetle traffic from the Lambda subnet.
          IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: !Ref LambdaSubnetCidr
      SecurityGroupEgress:
        - Description: Initial package installation, SSM, and WireGuard traffic.
          IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  WireGuardGatewayRole:
    Type: AWS::IAM::Role
    Condition: WireGuardGatewayEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - !Sub ec2.${AWS::URLSuffix}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WireGuardGatewaySessionManager
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:UpdateInstanceInformation
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: "*"
        - PolicyName: WireGuardGatewayPrivateKeyRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${WireGuardPrivateKeyParameterName}

  WireGuardGatewayInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: WireGuardGatewayEnabled
    Properties:
      Roles:
        - !Ref WireGuardGatewayRole

  WireGuardGatewayLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Condition: WireGuardGatewayEnabled
    # The gateway Rule excludes the empty subnet default before this resource exists.
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - W1030
    Properties:
      LaunchTemplateData:
        ImageId: !Ref WireGuardAmiId
        InstanceType: !Ref WireGuardInstanceType
        IamInstanceProfile:
          Name: !Ref WireGuardGatewayInstanceProfile
        MetadataOptions:
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 1
          HttpTokens: required
        NetworkInterfaces:
          - AssociatePublicIpAddress: true
            DeleteOnTermination: true
            DeviceIndex: 0
            Groups:
              - !Ref WireGuardGatewaySecurityGroup
            SubnetId: !Ref GatewayPublicSubnetId
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub ${AWS::StackName}-wireguard-gateway
        UserData:
          Fn::Base64:
            Fn::Sub: |
              #!/bin/bash
              set -euo pipefail
              umask 077

              install_attempt=1
              until dnf install -y wireguard-tools; do
                  if [ "$install_attempt" -ge 5 ]; then
                      echo "WireGuard package installation failed after five attempts." >&2
                      exit 1
                  fi
                  install_attempt=$((install_attempt + 1))
                  sleep 10
              done

              private_key=""
              parameter_attempt=1
              while [ "$parameter_attempt" -le 5 ]; do
                  if private_key="$(aws ssm get-parameter \
                      --region '${AWS::Region}' \
                      --name '${WireGuardPrivateKeyParameterName}:${WireGuardPrivateKeyParameterVersion}' \
                      --with-decryption \
                      --query 'Parameter.Value' \
                      --output text)"; then
                      break
                  fi
                  if [ "$parameter_attempt" -ge 5 ]; then
                      echo "WireGuard private-key retrieval failed after five attempts." >&2
                      exit 1
                  fi
                  parameter_attempt=$((parameter_attempt + 1))
                  sleep 10
              done

              if [ -z "$private_key" ]; then
                  echo "WireGuard private-key retrieval returned an empty value." >&2
                  exit 1
              fi

              derived_public_key="$(printf '%s\n' "$private_key" | wg pubkey)"
              if [ "$derived_public_key" != '${WireGuardGatewayPublicKey}' ]; then
                  unset private_key derived_public_key
                  echo "WireGuard gateway public key does not match the private key." >&2
                  exit 1
              fi
              unset derived_public_key

              printf '%s\n' 'net.ipv4.ip_forward=1' \
                  > /etc/sysctl.d/99-wireguard-forwarding.conf
              sysctl --system >/dev/null

              install -d -m 0700 /etc/wireguard
              cat > /etc/wireguard/wg0.conf <<EOF
              [Interface]
              Address = 10.200.0.1/24
              ListenPort = 51820
              PrivateKey = $private_key

              [Peer]
              PublicKey = ${WireGuardWorkstationPublicKey}
              AllowedIPs = 10.200.0.2/32
              EOF
              chmod 0600 /etc/wireguard/wg0.conf
              unset private_key

              systemctl enable --now wg-quick@wg0
              wg show wg0 >/dev/null
              ip -4 address show dev wg0 | grep -Fq 'inet 10.200.0.1/24 '
              [ "$(sysctl -n net.ipv4.ip_forward)" = "1" ]

  WireGuardGatewayInstance:
    Type: AWS::EC2::Instance
    Condition: WireGuardGatewayEnabled
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref WireGuardGatewayLaunchTemplate
        Version: !GetAtt WireGuardGatewayLaunchTemplate.LatestVersionNumber
      SourceDestCheck: false

  WireGuardGatewayElasticIp:
    Type: AWS::EC2::EIP
    Condition: WireGuardGatewayEnabled
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-wireguard-gateway

  WireGuardGatewayElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Condition: WireGuardGatewayEnabled
    Properties:
      AllocationId: !GetAtt WireGuardGatewayElasticIp.AllocationId
      InstanceId: !Ref WireGuardGatewayInstance

  WireGuardLambdaRoute:
    Type: AWS::EC2::Route
    Condition: WireGuardGatewayEnabled
    DependsOn: WireGuardGatewayElasticIpAssociation
    Properties:
      RouteTableId: !Ref LambdaRouteTableId
      DestinationCidrBlock: 10.200.0.0/24
      InstanceId: !Ref WireGuardGatewayInstance

Outputs:
  IntakeFunctionName:
    Description: Deployed operation intake Lambda function name.
    Value: !Ref IntakeFunction
  IntakeFunctionArn:
    Description: Deployed operation intake Lambda function ARN.
    Value: !GetAtt IntakeFunction.Arn
  IntakeFunctionUrl:
    Description: Public operation intake Lambda Function URL.
    Value: !GetAtt IntakeFunctionUrl.FunctionUrl
  QueryFunctionName:
    Description: Deployed operation query Lambda function name.
    Value: !Ref QueryFunction
  QueryFunctionArn:
    Description: Deployed operation query Lambda function ARN.
    Value: !GetAtt QueryFunction.Arn
  QueryFunctionUrl:
    Description: Public tenant-scoped operation query Lambda Function URL.
    Value: !GetAtt QueryFunctionUrl.FunctionUrl
  TigerBeetleProcessorName:
    Description: Deployed TigerBeetle processor Lambda function name.
    Value: !Ref TigerBeetleProcessor
  TigerBeetleProcessorArn:
    Description: Deployed TigerBeetle processor Lambda function ARN.
    Value: !GetAtt TigerBeetleProcessor.Arn
  CompletionProcessorName:
    Description: Deployed Completion processor Lambda function name.
    Value: !Ref CompletionProcessor
  CompletionProcessorArn:
    Description: Deployed Completion processor Lambda function ARN.
    Value: !GetAtt CompletionProcessor.Arn
  WireGuardGatewayInstanceId:
    Condition: WireGuardGatewayEnabled
    Description: EC2 instance ID of the WireGuard gateway.
    Value: !Ref WireGuardGatewayInstance
  WireGuardGatewayElasticIp:
    Condition: WireGuardGatewayEnabled
    Description: Elastic IPv4 address of the WireGuard gateway.
    Value: !Ref WireGuardGatewayElasticIp
  WireGuardGatewayEndpoint:
    Condition: WireGuardGatewayEnabled
    Description: Public UDP endpoint of the WireGuard gateway.
    Value: !Sub ${WireGuardGatewayElasticIp}:51820
  WireGuardGatewayPublicKey:
    Condition: WireGuardGatewayEnabled
    Description: Public key of the WireGuard gateway.
    Value: !Ref WireGuardGatewayPublicKey
  WireGuardGatewayAddress:
    Condition: WireGuardGatewayEnabled
    Description: Address of the gateway on the WireGuard overlay.
    Value: 10.200.0.1/24
