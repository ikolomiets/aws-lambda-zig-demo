AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Deploy intake, query, and SQS-driven execution Lambdas.

Parameters:
  IntakeFunctionName:
    Type: String
    Default: intake-lambda
    Description: Name of the operation intake Lambda function.
  QueryFunctionName:
    Type: String
    Default: query-lambda
    Description: Name of the operation query Lambda function.
  ExecutionFunctionName:
    Type: String
    Default: execution-lambda
    Description: Name of the operation execution Lambda function.
  LambdaPrincipal:
    Type: String
    Default: "*"
    Description: Value exposed to the function as LAMBDA_PRINCIPAL.
  PasetoPublicKey:
    Type: String
    Description: Padded Base64 Ed25519 public key used to verify PASETO tokens.

Resources:
  OperationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  OperationsQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  IntakeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref IntakeFunctionName
      Description: Authenticated operation intake function built with aws-lambda-zig.
      CodeUri: intake-lambda.zip
      Runtime: provided.al2023
      Handler: bootstrap
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 3
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt OperationsTable.Arn
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt OperationsQueue.Arn
      Environment:
        Variables:
          LAMBDA_PRINCIPAL: !Ref LambdaPrincipal
          OPERATIONS_QUEUE_URL: !Ref OperationsQueue
          OPERATIONS_TABLE_NAME: !Ref OperationsTable
          PASETO_PUBLIC_KEY: !Ref PasetoPublicKey

  IntakeFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt IntakeFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED

  FunctionUrlInvokeFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    DependsOn: IntakeFunctionUrl
    Properties:
      FunctionName: !Ref IntakeFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  FunctionUrlInvokeFunctionPermission:
    Type: AWS::Lambda::Permission
    DependsOn: IntakeFunctionUrl
    Properties:
      FunctionName: !Ref IntakeFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  QueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref QueryFunctionName
      Description: Authenticated tenant-scoped operation query built with aws-lambda-zig.
      CodeUri: query-lambda.zip
      Runtime: provided.al2023
      Handler: bootstrap
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 3
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt OperationsTable.Arn
      Environment:
        Variables:
          LAMBDA_PRINCIPAL: !Ref LambdaPrincipal
          OPERATIONS_TABLE_NAME: !Ref OperationsTable
          PASETO_PUBLIC_KEY: !Ref PasetoPublicKey

  QueryFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt QueryFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED

  QueryFunctionUrlInvokeFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    DependsOn: QueryFunctionUrl
    Properties:
      FunctionName: !Ref QueryFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  QueryFunctionUrlInvokeFunctionPermission:
    Type: AWS::Lambda::Permission
    DependsOn: QueryFunctionUrl
    Properties:
      FunctionName: !Ref QueryFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  ExecutionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref ExecutionFunctionName
      Description: SQS-driven operation execution function built with aws-lambda-zig.
      CodeUri: execution-lambda.zip
      Runtime: provided.al2023
      Handler: bootstrap
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 3
      Policies:
        - AWSLambdaBasicExecutionRole
        - SQSPollerPolicy:
            QueueName: !GetAtt OperationsQueue.QueueName
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt OperationsTable.Arn
      Environment:
        Variables:
          OPERATIONS_TABLE_NAME: !Ref OperationsTable

  ExecutionFunctionOperationsQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref ExecutionFunction
      EventSourceArn: !GetAtt OperationsQueue.Arn
      Enabled: true
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 0
      FunctionResponseTypes:
        - ReportBatchItemFailures

Outputs:
  IntakeFunctionName:
    Description: Deployed operation intake Lambda function name.
    Value: !Ref IntakeFunction
  IntakeFunctionArn:
    Description: Deployed operation intake Lambda function ARN.
    Value: !GetAtt IntakeFunction.Arn
  IntakeFunctionUrl:
    Description: Public operation intake Lambda Function URL.
    Value: !GetAtt IntakeFunctionUrl.FunctionUrl
  QueryFunctionName:
    Description: Deployed operation query Lambda function name.
    Value: !Ref QueryFunction
  QueryFunctionArn:
    Description: Deployed operation query Lambda function ARN.
    Value: !GetAtt QueryFunction.Arn
  QueryFunctionUrl:
    Description: Public tenant-scoped operation query Lambda Function URL.
    Value: !GetAtt QueryFunctionUrl.FunctionUrl
  ExecutionFunctionName:
    Description: Deployed operation execution Lambda function name.
    Value: !Ref ExecutionFunction
  ExecutionFunctionArn:
    Description: Deployed operation execution Lambda function ARN.
    Value: !GetAtt ExecutionFunction.Arn
